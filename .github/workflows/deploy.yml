name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub Pages へのデプロイ権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を制限（1つのデプロイのみ）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # デプロイ前の検証(lint・テスト・ビルド・モック混入チェック)。
  # id-token / pages の権限は不要なので contents: read に絞る。
  pre-deploy-verify:
    name: pre-deploy-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify
        uses: ./.github/actions/verify

  build:
    runs-on: ubuntu-latest
    needs: pre-deploy-verify

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # build は id-token: write / pages: write を持つ権限の強いジョブ。
      # 検証ジョブが保存した npm キャッシュを復元させないため cache は使わない。
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
